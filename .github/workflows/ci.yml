# ═══════════════════════════════════════════════════════════
# CI for ClaimTheSquare: fire porter før noe når registret.
#
#   format    dotnet format --verify-no-changes
#   build     restore → bygg → test → sårbarhetsskann
#   compose   begge compose-filene henger sammen
#   image     bygg → røyk-test → push til GHCR (sha-<kort> + latest)
#
# Trigges av hver push og hver pull request. Imaget tagges med commit-SHA
# (uforanderlig) + latest. Røyk-testen kjører FØR push: et image som ikke
# svarer, kommer seg aldri inn i registret.
#
# Actionsversjoner: alle på Node 24 (runner v2.327.1+). Node 20-runtimes er
# deprecated og blir blokkert — det er derfor ingen @v4/@v5/@v6 igjen her.
#   actions/checkout          v4 → v7
#   actions/setup-dotnet      v4 → v6
#   docker/setup-buildx-action v3 → v4
#   docker/metadata-action    v5 → v6
#   docker/build-push-action  v6 → v7
#   docker/login-action       v3 → v4
# ═══════════════════════════════════════════════════════════
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manuell kjøring = rollback. Skriv inn en eldre sha-tagg fra Packages, og
  # deploy-jobben ruller serveren tilbake til akkurat den. Uten denne
  # triggeren finnes det ingen vei tilbake som ikke krever SSH.
  workflow_dispatch:
    inputs:
      tag:
        description: 'sha-tag fra Packages, f.eks. sha-1a2b3c4. Tom = deploy siste bygg.'
        required: false
        default: ''

# Minst mulige rettigheter — jobben får bare det den trenger
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ghcr.io/<bruker>/<repo>

jobs:
  format:
    name: Kvalitetsport · dotnet format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Solution-filen nevnes eksplisitt: ligger både solution og csproj i
      # repo-rota, nekter dotnet format å gjette, og porten blir rød av en
      # grunn som ikke har med koden din å gjøre.
      - run: dotnet format ClaimTheSquare.slnx --verify-no-changes

  build:
    name: Bygg og test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore
      # Kvalitetsport: rød test stopper alt under her
      - run: dotnet test --no-build --logger "console;verbosity=normal"
      # Kvalitetsport: kjente sårbarheter i NuGet-pakker
      - run: dotnet list package --vulnerable --include-transitive

  compose:
    name: Kvalitetsport · compose henger sammen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: compose.prod.yml er gyldig, og image-referansen henger sammen
        run: |
          API_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} IMAGE_TAG=sha-0000000 \
            docker compose -f compose.prod.yml config > /tmp/config.yml
          # compose leser .env. Uten API_IMAGE blir ${API_IMAGE} tom, og
          # referansen blir ":sha-0000000" — gyldig YAML, verdt ingenting.
          # Derfor sjekker vi at referansen faktisk ble til et image-navn:
          grep -q "image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-0000000" /tmp/config.yml
      - name: dev-stacken (compose.yml) er gyldig
        run: docker compose -f compose.yml config --quiet

  image:
    name: Bygg, røyk-test og push image til GHCR
    runs-on: ubuntu-latest
    # Røyk-testen er også en port: ingenting går i registret før den er grønn
    needs: [format, build, compose]
    if: github.event_name == 'push'
    # Deploy-jobben trenger taggen. Jobber arver ikke steps-outputs fra
    # hverandre — bare det jobben eksplisitt eksporterer her.
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Metadata og tags (sha-<kort> + latest)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      # 1) Bygg til lokalt — ikke pushet ennå
      - name: Bygg (lokalt, ingen push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ClaimTheSquare/Dockerfile
          load: true
          push: false
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Røyk-test: start det og spør det det du kommer til å spørre
      - name: Røyk-test av imaget
        run: |
          docker run -d --name test -p 8080:8080 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          # 200 er ikke nok: svaret skal være JSON, og det skal være *dette* bygget
          for i in $(seq 1 20); do
            curl --fail --silent http://localhost:8080/health >/dev/null && break
            sleep 1
          done
          curl --fail --silent http://localhost:8080/health | grep -q '"status":"ok"'
          curl --fail --silent http://localhost:8080/health \
            | grep -q "${{ steps.meta.outputs.version }}"
          # Frontenden skal serveres fra samme origin — det er hele arkitekturen
          curl --fail --silent http://localhost:8080/ | grep -q 'text-objects'
          # Svarer ikke porten (sikkert brannmur?), spør inne i containeren:
          #   docker exec test wget -qO- http://127.0.0.1:8080/health

      # 3) Nå — og først nå — push
      - name: Logg inn på GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (porten var grønn)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ClaimTheSquare/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy til VPS over SSH ──────────────────────────────────────────
  # Denne jobben er hele forskjellen mellom fredag i forrige uke og en ekte
  # utrulling. Den bygger ingenting — den ber serveren hente det imaget som
  # nettopp ble verifisert to ganger.
  deploy:
    name: Deploy til VPS
    runs-on: ubuntu-latest
    needs: [image]
    # Kjør på push (vanlig deploy) OG på manuell dispatch (rollback til en
    # gammel tag). Uten dispatch-delen blir rollback-jobben hoppet over.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - name: SSH-nøkkel
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # ssh-keyscan tar et vertsnavn, ikke bruker@vert. Derfor er
          # VPS_HOST et rent navn eller en ren IP — brukeren står i VPS_USER.
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Send konfigurasjonen til serveren
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p /opt/stack/db/init"
          scp compose.prod.yml "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/stack/"
          # Skjemaet eies av databasen i prod, og postgres-imaget leser det fra
          # denne katalogen ved FØRSTE oppstart av et tomt volum. Glemmer du
          # denne linja, starter stacken fint og /health er grønn — men
          # /text-objects svarer 500 fordi tabellen ikke finnes.
          scp db/init/*.sql "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/stack/db/init/"

      - name: Pull og bytt container
        run: |
          # Merk: på en manuell kjøring (rollback) kjører `image`-jobben også —
          # den bygger et ferskt image vi ikke bruker. Det er sløsing, ikke feil:
          # taggen kommer fra inputs.tag. Vil du unngå det, legg rollback i sin
          # egen workflow med `tag` som eneste input.
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/stack
          export API_IMAGE=ghcr.io/${{ github.repository }}
          export IMAGE_TAG=${{ inputs.tag || needs.image.outputs.version }}
          podman compose -f compose.prod.yml pull
          podman compose -f compose.prod.yml up -d
          EOF

      - name: Helseport (retry i 60 s — containere trenger tid)
        run: |
          HOST=${{ vars.APP_HOSTNAME }}
          TAG=${{ inputs.tag || needs.image.outputs.version }}
          test -n "$TAG"   # en tom tagg ville gjort grep-en under innholdsløs
          for i in $(seq 1 30); do
            curl --fail --silent "https://$HOST/health" >/dev/null && break
            sleep 2
          done
          # Lever web-laget?
          curl --fail --silent "https://$HOST/health" | grep -q '"status":"ok"'
          # Beviset: kjører serveren akkurat det bygget vi pushet?
          curl --fail --silent "https://$HOST/version.json" | grep -q "$TAG"
          # Hele kjeden, ikke bare prosessen — denne rører Postgres
          curl --fail --silent "https://$HOST/text-objects" >/dev/null
